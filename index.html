<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Misi Android Studio: Bangun Aplikasi Pertamamu</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#0b1620;overflow:hidden;font-family:"Segoe UI",Tahoma,Arial,sans-serif}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:0 0;background:#12263A;color:#fff;display:flex;flex-direction:column}
#hd{height:64px;display:flex;align-items:center;gap:24px;padding:0 32px;background:#0b1620;font-size:20px}
#hd b{flex:1;font-size:22px}
#mn{flex:1;padding:20px 40px;overflow:hidden;position:relative}
#ft{height:76px;display:flex;justify-content:space-between;align-items:center;padding:0 40px;background:#0b1620;font-size:20px}
button{font:inherit;font-size:20px;cursor:pointer;min-height:48px;border-radius:10px;border:2px solid #5a7a98;background:#1c3a54;color:#fff;padding:8px 18px;text-align:left}
button:hover:not(:disabled){border-color:#F2B84B}
button:focus-visible,g:focus-visible{outline:3px solid #F2B84B;outline-offset:2px}
button:disabled{opacity:.5;cursor:default}
button.ok:disabled,button.bad:disabled{opacity:1}
.pri{background:#F2B84B;color:#12263A;border-color:#F2B84B;font-weight:700;text-align:center}
.ok{background:#1F7A52!important;border-color:#1F7A52!important;color:#fff!important}
.bad{background:#B3261E!important;border-color:#B3261E!important;color:#fff!important}
h1{font-size:56px;margin:0 0 8px}h2{font-size:30px;margin:0 0 8px}
p{font-size:22px;line-height:1.4;margin:0 0 10px;max-width:880px}
ul{font-size:21px;line-height:1.4;margin:0;padding-left:24px}li{margin-bottom:8px}
.card{background:#1c3a54;border-radius:14px;padding:18px 24px}
.row{display:flex;gap:28px}.col{flex:1;display:flex;flex-direction:column;gap:10px}
#fb{min-height:56px;font-size:21px;padding:12px 18px;border-radius:10px;background:#0b1620;margin-top:12px}
#fb.ok{background:#1F7A52!important}#fb.bad{background:#B3261E!important}
.slot{font-size:20px;padding:11px 0;border-bottom:1px solid #3d5c78}
.reg rect{fill:#284560;stroke:#8fb0cc;stroke-width:2;cursor:pointer}.reg text{fill:#fff;pointer-events:none;font-weight:700}
.reg.sel rect{fill:#F2B84B}.reg.sel text{fill:#12263A}.reg.ok rect{fill:#1F7A52;cursor:default}.reg.ok text{fill:#fff}
.ovl{position:absolute;inset:0;background:rgba(11,22,32,.93);display:flex;align-items:center;justify-content:center;text-align:center;z-index:5}
textarea{width:100%;height:80px;font:inherit;font-size:19px;border-radius:8px;border:2px solid #5a7a98;padding:8px;background:#fff;color:#12263A}
code{font-family:Consolas,monospace;background:#0b1620;padding:2px 8px;border-radius:6px;color:#F2B84B}
[draggable=true]{cursor:grab}
</style></head><body>
<div id="stage"><div id="hd"></div><div id="mn"></div><div id="ft"></div></div>
<script>
const E=id=>document.getElementById(id);
const mk=()=>({done:Array(15).fill(0),sc:Array(15).fill(0),lv:Array(15).fill(3),m:Array(15).fill(null)});
const S=Object.assign({scr:'cover'},mk());
const idx=s=>s=='demo'?14:/^m\d+$/.test(s)?+s.slice(1)-1:-1;
let ac,mute=false;
const total=()=>S.sc.reduce((a,b)=>a+b,0);
function snd(ok){if(mute)return;try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type=ok?'sine':'square';o.frequency.value=ok?660:200;g.gain.value=.07;o.start();o.stop(ac.currentTime+(ok?.15:.25))}catch(e){}}
function fb(t,c){const f=E('fb');if(f){f.textContent=t;f.className=c||''}}
function stopT(){const m=S.m[4];if(m&&m.iv){clearInterval(m.iv);m.iv=null}}
function lose(i){S.lv[i]--;snd(0);hud();if(S.lv[i]<=0){stopT();const d=document.createElement('div');d.className='ovl';d.innerHTML='<div class="card"><h2>Nyawa habis</h2><p>Tenang, setiap developer pernah gagal build. Baca petunjuk dengan teliti lalu coba lagi.</p><button class="pri" id="rt">Ulangi misi</button></div>';E('mn').appendChild(d);E('rt').onclick=()=>{S.lv[i]=3;S.sc[i]=0;S.done[i]=0;S.m[i]=null;go('m'+(i+1))}}}

/* ---------- data ---------- */
const P=[['Run','Menjalankan aplikasi ke emulator atau HP','run','Toolbar di bagian atas berisi tombol Run.'],
['Project','Menampilkan struktur folder dan file proyek','pr','Panel di kiri menampilkan folder dan file.'],
['Editor','Tempat menulis kode dan mengatur tampilan layout','ed','Bagian tengah adalah area kerja utama.'],
['Device Manager','Membuat dan mengelola perangkat virtual (emulator)','dm','Panel di kanan mengelola perangkat virtual.'],
['Logcat','Menampilkan log dan pesan error saat aplikasi berjalan','lg','Panel di bawah memuat pesan sistem.']];
const PERM=[3,0,4,2,1];
const ST=['Pilih New Project di layar Welcome','Pilih template Empty Activity','Isi nama aplikasi, package, bahasa, dan Minimum SDK','Klik Finish lalu tunggu Gradle sync selesai','Pilih emulator di Device Manager','Klik tombol Run'];
const EX=['Proyek baru selalu dimulai dari sini.','Template menentukan kerangka awal aplikasi.','Identitas aplikasi harus jelas sebelum dibuat.','Gradle menyusun proyek sebelum bisa dijalankan.','Aplikasi butuh perangkat tujuan untuk berjalan.','Terakhir, jalankan dan lihat hasilnya.'];
const SH=[3,0,5,2,4,1];
const Q=[{q:'Klien melapor: aplikasi langsung tertutup (crash) saat tombol Simpan ditekan. Apa langkah pertamamu?',o:['Buka Logcat, filter level Error, lalu cari baris pesan exception','Instal ulang Android Studio','Ganti emulator dengan yang lebih besar'],a:0,e:'Logcat mencatat penyebab crash, jadi baca dulu sebelum mengubah apa pun.'},
{q:'Logcat menunjuk error pada baris <code>findViewById(R.id.____)</code>. Di layout, ID tombolnya adalah <code>btn_simpan</code>. Isian yang benar?',o:['btnSimpan','btn_simpan','Simpan'],a:1,e:'ID harus sama persis dengan di layout, termasuk huruf dan garis bawah.'},
{q:'Setelah menambah library di build.gradle, Gradle sync gagal dan tab Build penuh warna merah. Tindakan yang tepat?',o:['Hapus seluruh folder proyek','Abaikan error dan langsung klik Run','Baca pesan di tab Build, perbaiki dependensi, lalu klik Sync Now'],a:2,e:'Pesan di tab Build menunjuk dependensi yang bermasalah. Perbaiki lalu sync ulang.'}];

const SL=['TextView','EditText','Button','ImageView'];
const D=[
{q:'Bagian mana yang dipakai untuk membaca pesan error saat aplikasi berjalan?',o:['Project','Editor','Logcat'],a:2,e:'Logcat menampilkan log dan pesan error.'},
{q:'Apa fungsi Device Manager?',o:['Mengelola perangkat virtual (emulator)','Menulis kode program','Membaca pesan error'],a:0,e:'Device Manager membuat dan mengelola emulator.'},
{q:'File mana yang memuat daftar Activity dan izin aplikasi?',o:['strings.xml','build.gradle','AndroidManifest.xml'],a:2,e:'Manifest menyimpan identitas, Activity, dan izin aplikasi.'},
{q:'Untuk apa Gradle sync dilakukan?',o:['Menghapus data emulator','Memuat ulang pengaturan build agar proyek sesuai','Mengganti versi Android di HP'],a:1,e:'Sync menyelaraskan proyek dengan pengaturan build.gradle.'},
{q:'Minimum SDK menentukan apa?',o:['Versi Android terlama yang bisa menjalankan aplikasi','Ukuran layar aplikasi','Bahasa pemrograman yang dipakai'],a:0,e:'Perangkat dengan Android lebih lama tidak bisa memasang aplikasi.'},
{q:'Di folder mana file layout tampilan layar disimpan?',o:['res/layout','manifests','Gradle Scripts'],a:0,e:'File XML tampilan layar berada di res/layout.'},
{q:'Level Logcat mana yang paling tepat untuk mencari penyebab crash?',o:['Verbose','Info','Error'],a:2,e:'Filter Error menyaring pesan kegagalan.'},
{q:'Package name aplikasi sebaiknya...',o:['Sama dengan aplikasi lain','Unik untuk tiap aplikasi','Dikosongkan'],a:1,e:'Package name adalah identitas unik aplikasi.'}];

/* ---------- tantangan 6-14 ---------- */
const CH={
5:{t:'M',n:'Kenali File Proyek',i:'Klik satu file di kiri, lalu pilih fungsinya di kanan.',p:[['AndroidManifest.xml','Daftar Activity dan izin aplikasi','Manifest berfungsi seperti kartu identitas aplikasi.'],['strings.xml','Teks yang dipakai di tampilan','Teks dipisah agar mudah diubah atau diterjemahkan.'],['build.gradle','Library tambahan dan versi SDK','Di sinilah dependensi library ditambahkan.'],['MainActivity.kt','Kode logika layar utama','Perilaku layar ditulis dalam file Kotlin.']]},
6:{t:'C',n:'Satuan dp dan sp',i:'Tentukan satuan yang tepat untuk setiap item.',b:['dp (ukuran elemen)','sp (ukuran huruf)'],it:[['Lebar tombol Hitung',0,'Ukuran elemen memakai dp agar konsisten di berbagai layar.'],['Ukuran huruf judul Kasir',1,'Ukuran huruf memakai sp, mengikuti pengaturan huruf pengguna.'],['Jarak antar kolom (margin)',0,'Margin adalah ukuran elemen, jadi memakai dp.'],['Ukuran huruf harga barang',1,'Teks memakai sp.'],['Tinggi gambar logo koperasi',0,'Gambar adalah elemen, jadi memakai dp.']]},
7:{t:'Q',n:'Pilih Layout yang Tepat',q:[{q:'Kolom harga, jumlah, dan tombol harus tersusun sederhana dari atas ke bawah. Layout yang cocok?',o:['LinearLayout dengan orientation vertical','RecyclerView','WebView'],a:0,e:'LinearLayout vertikal menyusun elemen berurutan dari atas ke bawah.'},{q:'Koperasi punya ratusan barang yang harus tampil sebagai daftar yang bisa digulir. Pilihan paling efisien?',o:['Ratusan TextView satu per satu','RecyclerView','Satu EditText besar'],a:1,e:'RecyclerView menampilkan daftar panjang dengan menggunakan ulang tampilan.'},{q:'Tombol Bayar harus selalu di bawah dan di tengah layar, apa pun ukuran HP. Layout yang tepat?',o:['Posisi dengan koordinat piksel tetap','Dua layar terpisah','ConstraintLayout dengan constraint ke bawah dan tengah'],a:2,e:'ConstraintLayout mengatur posisi relatif terhadap tepi layar atau elemen lain.'}]},
8:{t:'O',n:'Alur Data Transaksi',i:'Klik tahap sesuai urutan alur data saat tombol Hitung ditekan.',s:[['Kasir mengisi harga lalu menekan Hitung','Semua proses dipicu oleh aksi pengguna.'],['Aplikasi membaca isi kolom harga sebagai teks','Data dibaca dulu sebelum diolah.'],['Teks diubah menjadi angka dengan toInt()','Teks belum bisa dihitung sebelum menjadi angka.'],['Aplikasi menghitung total belanja','Barulah perhitungan dilakukan.'],['Total ditampilkan di layar','Hasil ditampilkan agar kasir bisa melihatnya.']]},
9:{t:'F',n:'Hitung Total dengan Kotlin',i:'Lengkapi kode dari atas ke bawah. Bagian kuning adalah yang harus diisi.',x:'Diskon 10% berlaku jika total lebih dari Rp50.000. ID kolom harga: edit_harga, ID label hasil: txt_total.',l:'val harga = edit_harga.text.toString().~()\nval total = harga ~ jumlah\nif (total ~ 50000) { diskon = total / 10 }\ntxt_total.~ = "Rp " + total',a:['toInt','*','>','text'],w:['toInt','toString','*','+','>','<','text','hint'],h:['Teks harus diubah menjadi bilangan bulat.','Total adalah hasil perkalian harga dan jumlah.','Diskon berlaku jika total lebih besar dari 50.000.','Properti ini mengisi teks pada TextView.']},
10:{t:'Q',n:'Izin Aplikasi',q:[{q:'Aplikasi kasir meminta izin Kontak dan Lokasi, padahal tidak memakainya. Apa tindakanmu?',o:['Biarkan saja, siapa tahu dipakai nanti','Hapus izin yang tidak dibutuhkan dari manifest','Minta pengguna mengizinkan semua izin'],a:1,e:'Prinsip izin minimal: hanya minta izin yang benar-benar dipakai.'},{q:'Pengguna menolak izin Kamera untuk pindai barcode, lalu aplikasi crash. Perbaikan yang tepat?',o:['Jelaskan alasan izin dan sediakan input manual','Paksa aplikasi tertutup','Sembunyikan pesan error'],a:0,e:'Aplikasi harus tetap berjalan dan memberi alternatif saat izin ditolak.'},{q:'Cetak struk lewat printer Bluetooth butuh izin khusus. Di file mana izin dideklarasikan?',o:['strings.xml','activity_main.xml','AndroidManifest.xml'],a:2,e:'Izin dideklarasikan di AndroidManifest.xml.'}]},
11:{t:'C',n:'Emulator atau HP Asli',i:'Tentukan tempat pengujian yang paling tepat untuk tiap item.',b:['Emulator','HP asli'],it:[['Mencoba tampilan di layar tablet',0,'Emulator bisa meniru berbagai ukuran layar.'],['Memindai barcode dengan kamera',1,'Kamera dan sensor paling akurat diuji di perangkat nyata.'],['Menguji di Android versi lama',0,'Emulator bisa dibuat untuk berbagai versi Android.'],['Mencetak struk ke printer Bluetooth',1,'Perangkat keras nyata hanya teruji di HP asli.'],['Mengecek tampilan layar kecil',0,'Ukuran layar bisa disimulasikan di emulator.']]},
12:{t:'Q',n:'Etika dan Keamanan Data',q:[{q:'Pelanggan koperasi mendaftar dengan kata sandi. Bagaimana cara menyimpannya di database?',o:['Teks biasa agar mudah dicek','Di-hash, bukan teks biasa','Dicetak di Logcat untuk pengecekan'],a:1,e:'Kata sandi di-hash agar tidak terbaca jika data bocor.'},{q:'Saat debugging kamu mencetak nomor HP pelanggan ke Logcat. Sebelum rilis, apa tindakanmu?',o:['Hapus kode log yang memuat data pribadi','Biarkan, Logcat hanya dilihat developer','Perbanyak isi log'],a:0,e:'Data pribadi tidak boleh masuk log karena bisa terbaca pihak lain.'},{q:'Kamu menemukan kode fitur diskon di internet. Sikap yang profesional?',o:['Klaim sebagai karya sendiri','Salin tanpa memeriksa lisensi','Periksa lisensi, pahami kodenya, cantumkan sumbernya'],a:2,e:'Etika profesi: patuhi lisensi dan hargai karya orang lain.'}]},
13:{t:'O',n:'Rilis ke Klien',i:'Klik tahap rilis sesuai urutan yang benar.',s:[['Uji semua fitur di emulator dan HP asli','Pengujian menemukan masalah sebelum klien melihatnya.'],['Perbaiki bug yang ditemukan','Bug harus beres sebelum paket dibuat.'],['Pilih Build > Generate Signed Bundle / APK','Paket rilis dibuat lewat menu Build.'],['Tanda tangani dengan keystore milik studio','Tanda tangan digital membuktikan asal aplikasi.'],['Serahkan APK dan panduan ke klien','Serah terima menutup proyek dengan dokumen jelas.']]}};
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const pm=n=>[...Array(n).keys()].map(j=>(j*(n%2?2:3)+1)%n);
const F0={M:'Pilih satu file di kiri, lalu pasangannya di kanan.',C:'Pilih kategori yang tepat.',Q:'Pilih tindakan yang paling tepat.',O:'Tahap apa yang paling awal?',F:'Pilih kata untuk bagian kosong pertama.'};
function RG(i){const c=CH[i],t=c.t,m=S.m[i]=S.m[i]||{n:0,sel:null,ok:[],w:0};let b='';
if(t=='M')b='<div class="row"><div class="col" style="gap:8px">'+c.p.map((p,j)=>'<button data-a="x" data-v="L'+j+'" class="'+(m.ok.includes(j)?'ok':m.sel===j?'pri':'')+'" '+(m.ok.includes(j)?'disabled':'')+'>'+p[0]+'</button>').join('')+'</div><div class="col" style="gap:8px">'+pm(c.p.length).map(j=>'<button data-a="x" data-v="R'+j+'" class="'+(m.ok.includes(j)?'ok':'')+'" '+(m.ok.includes(j)?'disabled':'')+'>'+c.p[j][1]+'</button>').join('')+'</div></div>';
else if(t=='C'){const x=c.it[m.n];b='<div class="card" style="text-align:center"><div style="font-size:18px;color:#8fb0cc">Item '+(m.n+1)+' dari '+c.it.length+'</div><h2 style="margin:6px 0 0;font-size:34px">'+x[0]+'</h2></div><div class="row" style="margin-top:14px">'+c.b.map((k,j)=>'<button data-a="x" data-v="'+j+'" style="flex:1;text-align:center;min-height:72px">'+k+'</button>').join('')+'</div>'}
else if(t=='Q'){const q=c.q[m.n];b='<div style="font-size:22px;margin-bottom:8px">Kasus '+(m.n+1)+' dari '+c.q.length+'</div><div class="card"><p style="margin:0">'+q.q+'</p></div><div class="col" style="margin-top:12px;gap:8px">'+q.o.map((o,k)=>'<button data-a="x" data-v="'+k+'">'+o+'</button>').join('')+'</div>'}
else if(t=='O')b='<div class="row"><div class="col" style="gap:8px">'+pm(c.s.length).map(j=>'<button data-a="x" data-v="'+j+'" class="'+(j<m.n?'ok':'')+'" '+(j<m.n?'disabled':'')+'>'+c.s[j][0]+'</button>').join('')+'</div><div class="card col" style="gap:0">'+c.s.map((s,j)=>'<div class="slot">'+(j+1)+'. '+(j<m.n?s[0]:'…')+'</div>').join('')+'</div></div>';
else b='<div class="card" style="font-family:Consolas,monospace;font-size:20px;line-height:2.1">'+c.l.split('~').map((s,k)=>esc(s).replace(/\n/g,'<br>')+(k<c.a.length?'<span style="display:inline-block;min-width:90px;padding:0 8px;border-radius:6px;text-align:center;background:'+(k<m.n?'#1F7A52':k==m.n?'#F2B84B':'#0b1620')+';color:'+(k==m.n?'#12263A':'#fff')+';border:1px dashed #8fb0cc">'+(k<m.n?esc(c.a[k]):'____')+'</span>':'')).join('')+'</div><p style="margin:8px 0;font-size:19px">'+c.x+'</p><div style="display:flex;flex-wrap:wrap;gap:8px">'+c.w.map(w=>'<button data-a="x" data-v="'+esc(w)+'">'+esc(w)+'</button>').join('')+'</div>';
E('mn').innerHTML='<h2>Tantangan '+(i+1)+': '+c.n+'</h2>'+(t=='Q'?'':'<p>'+c.i+'</p>')+b+'<div id="fb">'+F0[t]+'</div>'}

/* ---------- navigasi ---------- */
function hud(){const i=idx(S.scr),mm=i>=0&&i<14;
E('hd').style.display=S.scr=='cover'?'none':'flex';
E('hd').innerHTML='<b>Misi Android Studio</b><span>'+(mm?'Energi: '+'♥'.repeat(S.lv[i])+'♡'.repeat(3-S.lv[i]):'')+'</span><span>Skor: '+total()+'</span><span>Selesai: '+S.done.filter(x=>x).length+'/15</span><button id="mt">'+(mute?'Suara mati':'Suara aktif')+'</button><button id="mu">Menu</button>';
E('mt').onclick=()=>{mute=!mute;hud()};E('mu').onclick=()=>go('menu')}
function nav(){const s=S.scr,i=idx(s),all=S.done.every(x=>x),z=S.done.indexOf(0);
const pv=i>=0?'menu':{guide:'cover',menu:'guide',result:'menu',credit:'result'}[s];
let nx={cover:'guide',guide:'menu',menu:all?'result':(z<14?'m'+(z+1):'demo'),result:'credit'}[s],ok=s!='credit',lb=s=='cover'?'Mulai':'Berikutnya';
if(i>=0){ok=!!S.done[i];nx=i<13?'m'+(i+2):(i==13?'demo':(all?'result':'menu'));if(i==14)lb=all?'Lihat hasil':'Ke menu'}
const mid=i>=0?'Tantangan '+(i+1)+' dari 15':({guide:'Panduan',menu:'Menu tantangan',result:'Evaluasi',credit:'Informasi kreator'}[s]||'');
E('ft').innerHTML='<button id="pv" '+(pv?'':'style="visibility:hidden"')+'>Kembali</button><span>'+mid+'</span><button class="pri" id="nx" '+(ok?'':'disabled')+'>'+lb+'</button>';
if(pv)E('pv').onclick=()=>go(pv);E('nx').onclick=()=>nx&&go(nx)}
function go(s){stopT();S.scr=s;R[s]();hud();nav()}

/* ---------- layar ---------- */
const R={
cover(){E('mn').innerHTML='<div class="row" style="height:100%;align-items:center"><div class="col" style="flex:1.3;gap:6px"><h1>Misi Android Studio</h1><h2 style="color:#F2B84B;font-size:38px">Bangun Aplikasi Pertamamu</h2><p>Studio Kodeku menerima proyek aplikasi kasir untuk koperasi sekolah. Jadilah developer junior: kenali alat kerjamu, rancang layar, hubungkan kode, dan bereskan bug sebelum tenggat!</p></div><svg viewBox="0 0 300 440" width="270" height="396" role="img" aria-label="Ilustrasi ponsel Android dengan kode"><rect x="20" y="10" width="260" height="420" rx="36" fill="#1c3a54" stroke="#F2B84B" stroke-width="5"/><rect x="40" y="50" width="220" height="340" rx="14" fill="#0b1620"/><circle cx="150" cy="130" r="44" fill="#1F7A52"/><rect x="60" y="210" width="130" height="14" rx="7" fill="#F2B84B"/><rect x="60" y="240" width="180" height="14" rx="7" fill="#8fb0cc"/><rect x="60" y="270" width="100" height="14" rx="7" fill="#8fb0cc"/><rect x="60" y="320" width="180" height="38" rx="10" fill="#F2B84B"/></svg></div>'},
guide(){E('mn').innerHTML='<h2>Panduan</h2><div class="row"><div class="card col"><h2 style="font-size:26px">Tujuan belajar</h2><ul><li>Mengenali bagian jendela Android Studio dan fungsinya.</li><li>Menyusun langkah membuat dan menjalankan proyek.</li><li>Merancang layar dan menghubungkannya dengan kode.</li><li>Menemukan penyebab masalah lewat Logcat dan Gradle.</li></ul></div><div class="card col"><h2 style="font-size:26px">Aturan main</h2><ul><li>Ada 15 tantangan: 14 misi dan satu demo ke klien. Tiap misi punya 3 energi.</li><li>Jawaban benar memberi +100 skor. Jawaban salah mengurangi 1 energi.</li><li>Tantangan 5 punya waktu bonus, jadi ambil keputusan dengan cepat dan tepat.</li><li>Pilih misi bebas lewat Menu. Tombol Berikutnya aktif setelah misi selesai.</li></ul></div></div><p style="margin-top:14px">Mentor Bina menemanimu di studio. Kamu berlatih mengambil keputusan, memecahkan masalah, dan mengatur waktu seperti developer sungguhan.</p>'},
